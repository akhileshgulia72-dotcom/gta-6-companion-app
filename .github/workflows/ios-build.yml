name: iOS Build and TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Select Xcode 26.6
      # --------------------------------------------------
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app

          echo "========================================"
          echo "Xcode version"
          echo "========================================"

          xcodebuild -version

          echo "========================================"
          echo "iPhoneOS SDK version"
          echo "========================================"

          xcrun --sdk iphoneos --show-sdk-version

          echo "========================================"
          echo "Xcode path"
          echo "========================================"

          xcode-select -p


      # --------------------------------------------------
      # 3. Setup Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true


      # --------------------------------------------------
      # 4. Flutter Doctor
      # --------------------------------------------------
      - name: Flutter doctor
        run: flutter doctor -v


      # --------------------------------------------------
      # 5. Flutter Version
      # --------------------------------------------------
      - name: Flutter version
        run: flutter --version


      # --------------------------------------------------
      # 6. Get Dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get


      # --------------------------------------------------
      # 7. Import Apple Distribution Certificate
      # --------------------------------------------------
      - name: Import Apple Distribution Certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}


      # --------------------------------------------------
      # 8. Download App Store Provisioning Profile
      # --------------------------------------------------
      - name: Download Provisioning Profile
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.akhileshgulia.gta6companion
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}


      # --------------------------------------------------
      # 9. Prepare Flutter iOS Build
      # --------------------------------------------------
      - name: Prepare Flutter iOS build
        run: |
          echo "========================================"
          echo "Cleaning Flutter"
          echo "========================================"

          flutter clean

          echo "Removing generated Flutter ephemeral files..."

          rm -rf ios/Flutter/ephemeral

          echo "========================================"
          echo "Getting Flutter dependencies"
          echo "========================================"

          flutter pub get

          echo "========================================"
          echo "Flutter version"
          echo "========================================"

          flutter --version

          echo "========================================"
          echo "Checking generated Flutter Swift Package"
          echo "========================================"

          if [ -f ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift ]; then

            echo "FlutterGeneratedPluginSwiftPackage found."

            echo ""
            echo "----- Package.swift -----"

            head -80 \
              ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift

            echo "----- End Package.swift -----"

          else

            echo "ERROR: FlutterGeneratedPluginSwiftPackage was not generated."

            exit 1

          fi

          echo "========================================"
          echo "Checking Xcode project"
          echo "========================================"

          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then

            echo "project.pbxproj exists."

            echo ""
            echo "Runner target ID occurrences:"

            grep -c \
              "97C146ED1CF9000F007C117D" \
              ios/Runner.xcodeproj/project.pbxproj || true

            echo ""
            echo "FlutterGeneratedPluginSwiftPackage occurrences:"

            grep -c \
              "FlutterGeneratedPluginSwiftPackage" \
              ios/Runner.xcodeproj/project.pbxproj || true

          else

            echo "ERROR: project.pbxproj not found."

            exit 1

          fi

          echo "========================================"
          echo "Building Flutter iOS application"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}


      # --------------------------------------------------
      # 10. Create ExportOptions.plist
      # --------------------------------------------------
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>teamID</key>
              <string>PR4R9G4HZ3</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.akhileshgulia.gta6companion</key>
                  <string>GTA6 Companion App Store</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."


      # --------------------------------------------------
      # 11. Archive iOS App
      # --------------------------------------------------
      - name: Archive iOS App
        run: |
          echo "========================================"
          echo "Archiving iOS application"
          echo "========================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            archive


      # --------------------------------------------------
      # 12. Export IPA
      # --------------------------------------------------
      - name: Export IPA
        run: |
          echo "========================================"
          echo "Exporting IPA"
          echo "========================================"

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            -exportOptionsPlist "$PWD/ios/ExportOptions.plist" \
            -exportPath "$PWD/build/ios/ipa"


      # --------------------------------------------------
      # 13. Find and Validate IPA
      # --------------------------------------------------
      - name: Check IPA
        id: ipa
        shell: bash
        run: |

          echo "========================================"
          echo "Searching for generated IPA"
          echo "========================================"

          find "$GITHUB_WORKSPACE/build/ios/ipa" \
            -type f \
            -name "*.ipa" \
            -print

          IPA_FILE=$(find \
            "$GITHUB_WORKSPACE/build/ios/ipa" \
            -type f \
            -name "*.ipa" \
            -print \
            -quit)

          if [ -z "$IPA_FILE" ]; then

            echo "ERROR: No IPA was generated."

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "IPA successfully generated"
          echo "========================================"

          echo "$IPA_FILE"

          echo ""
          echo "IPA file information:"

          ls -lh "$IPA_FILE"

          echo ""
          echo "Saving exact IPA path for TestFlight..."

          echo "ipa_path=$IPA_FILE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 14. Upload to TestFlight
      # --------------------------------------------------
      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.ipa_path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}


      # --------------------------------------------------
      # 15. Upload IPA Artifact
      # --------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta6-ios-ipa
          path: build/ios/ipa/*.ipa
